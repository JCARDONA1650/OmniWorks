<aside class="sidebar" [class.sidebar--collapsed]="collapsed">
  <!-- Brand -->
  <div class="sidebar__brand">
    <div class="sidebar__logo">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8" fill="#1e6fff"/>
        <path d="M8 16L14 10L20 16L14 22L8 16Z" fill="white" opacity="0.9"/>
        <path d="M16 8L24 16L16 24" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <div class="sidebar__brand-text" *ngIf="!collapsed">
      <span class="sidebar__app-name">OmniWorks</span>
      <span class="sidebar__company">OnmiTek Solutions</span>
    </div>
  </div>

  <div class="sidebar__divider"></div>

  <!-- Navigation -->
  <nav class="sidebar__nav">
    <p class="sidebar__section-label" *ngIf="!collapsed">Sistema</p>

    <button
      *ngFor="let item of visibleNav"
      class="sidebar__item"
      [class.sidebar__item--active]="isActive(item.route)"
      (click)="navigate(item.route)"
    >
      <span class="sidebar__item-icon">
        <ng-container [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'home'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <svg *ngSwitchCase="'users'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </ng-container>
      </span>
      <span class="sidebar__item-label" *ngIf="!collapsed">{{ item.label }}</span>
      <span class="sidebar__item-indicator" *ngIf="isActive(item.route)"></span>
    </button>

    <!-- Modules -->
    <div *ngIf="modules.length > 0">
      <p class="sidebar__section-label" *ngIf="!collapsed" style="margin-top: 12px;">Módulos</p>
      <button
        *ngFor="let mod of modules"
        class="sidebar__item"
        [class.sidebar__item--active]="isActive(mod.route)"
        (click)="navigate(mod.route)"
      >
        <span class="sidebar__item-icon">
          <ng-container [ngSwitch]="getModuleIcon(mod.key)">
            <svg *ngSwitchCase="'mail'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <svg *ngSwitchCase="'file-text'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
            </svg>
            <svg *ngSwitchDefault width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
            </svg>
          </ng-container>
        </span>
        <span class="sidebar__item-label" *ngIf="!collapsed">{{ mod.name }}</span>
        <span class="sidebar__item-indicator" *ngIf="isActive(mod.route)"></span>
      </button>
    </div>
  </nav>

  <div class="sidebar__spacer"></div>

  <!-- User -->
  <div class="sidebar__user">
    <div class="sidebar__avatar">
      {{ currentUser?.first_name?.charAt(0) }}{{ currentUser?.last_name?.charAt(0) }}
    </div>
    <div class="sidebar__user-info" *ngIf="!collapsed">
      <span class="sidebar__user-name">{{ currentUser?.full_name }}</span>
      <span class="sidebar__user-role badge" [class.badge--admin]="currentUser?.is_admin" [class.badge--user]="!currentUser?.is_admin">
        {{ currentUser?.is_admin ? 'Admin' : 'Usuario' }}
      </span>
    </div>
    <button class="sidebar__logout" (click)="logout()" title="Cerrar sesión">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>
</aside>
